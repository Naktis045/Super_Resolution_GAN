[project]
name = "image-superresolution-gan"
version = "0.1.0"
description = "GAN project for image super-resolution"
authors = [
    {name = "Me"}
]
requires-python = ">=3.12"
dependencies = ["lightning (>=2.6.6,<3.0.0)", "torchmetrics (>=1.9.0,<2.0.0)", "black (>=26.5.1,<27.0.0)", "tensorboard (>=2.21.0,<3.0.0)", "pandas (>=3.0.6,<4.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
torch = "^2.2.0"
torchvision = "^0.17.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
